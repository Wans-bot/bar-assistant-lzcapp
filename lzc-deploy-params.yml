# 部署参数：安装时填（也可留空用默认值），平台用 text/template 渲染进 lzc-manifest.yml。
#
# 用途：免密登录。首次启动时由容器 content/admin-init.sh 用这组参数 POST
# /api/auth/register 建立管理员账号（幂等），登录页的 inject 再用同一组参数自动登录，
# 用户打开应用即已进入界面，不需要手打账号密码。
#
# 注意：全部标 optional —— 不填直接跳过部署界面；每个字段都有 sane default_value，
# 另外 lzc-manifest.yml 里每处引用都带 `{{ if (index .U "x") }}...{{ else }}兜底{{ end }}`，
# 以免参数缺失时被渲染成字面量 `<no value>`。
params:
  - id: admin_email
    type: string
    name: "管理员邮箱（免密登录用）"
    description: >-
      首次启动会自动用这个邮箱注册管理员账号；打开应用即自动登录，无需手打。
      留空则使用默认值 baradmin@lazycat.local。
    optional: true
    default_value: "baradmin@lazycat.local"

  - id: admin_password
    type: secret
    name: "管理员密码（免密登录用）"
    description: >-
      自动注册 / 自动登录所用的密码。安装时随机生成并固定（默认值 $random），
      也可在此自定义。登录页会自动填充并提交，用户不需要知道或输入它。
    optional: true
    default_value: "$random(len=20)"

  - id: admin_name
    type: string
    name: "管理员显示名"
    description: "自动创建的管理员账号的显示名称。留空则使用默认值 Bar Admin。"
    optional: true
    default_value: "Bar Admin"
